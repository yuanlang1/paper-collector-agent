name: paper-collector-memory

services:
  postgres:
    image: paper-collector-postgres:17-memory
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: paper-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yl
      POSTGRES_DB: agent_db
    command:
      - postgres
      - -c
      - hnsw.ef_search=100
      - -c
      - hnsw.iterative_scan=strict_order
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yl -d agent_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - memory-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
    external: true
    name: paper_agent_pgdata
  memory-redis-data:
