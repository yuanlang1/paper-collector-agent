syntax = "proto3";

package papercollector.agent.v1;

import "google/protobuf/wrappers.proto";

option java_multiple_files = true;
option java_package = "com.yl.papercollector.agent.v1";

service AgentService {
  rpc StartRun(StartRunRequest) returns (RunReference);
  rpc ResumeRun(ResumeRunRequest) returns (RunReference);
  rpc GetRun(GetRunRequest) returns (RunView);
  rpc SubscribeRunEvents(SubscribeRunEventsRequest) returns (stream RunEvent);
}

service ConversationService {
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
}

service SettingsService {
  rpc GetSourceLimits(GetSourceLimitsRequest) returns (SourceLimitsView);
  rpc UpdateSourceLimits(UpdateSourceLimitsRequest) returns (SourceLimitsView);
  rpc ListLlmProfiles(ListLlmProfilesRequest) returns (ListLlmProfilesResponse);
  rpc CreateLlmProfile(CreateLlmProfileRequest) returns (LlmProfileView);
  rpc UpdateLlmProfile(UpdateLlmProfileRequest) returns (LlmProfileView);
  rpc SetDefaultLlmProfile(SetDefaultLlmProfileRequest) returns (LlmProfileView);
  rpc DeleteLlmProfile(DeleteLlmProfileRequest) returns (DeleteLlmProfileResponse);
  rpc TestLlmProfile(TestLlmProfileRequest) returns (TestLlmProfileResponse);
}

message RunReference {
  string conversation_id = 1;
  string run_id = 2;
  string status = 3;
}

message StartRunRequest {
  string user_id = 1;
  string conversation_id = 2;
  string run_id = 3;
  string message = 4;
  google.protobuf.Int64Value llm_profile_id = 5;
}

message ResumeRunRequest {
  string user_id = 1;
  string conversation_id = 2;
  string run_id = 3;
  string action_id = 4;
  string decision = 5;
  string query_understanding_json = 6;
  string search_tag_json = 7;
  string comment = 8;
}

message GetRunRequest {
  string user_id = 1;
  string conversation_id = 2;
  string run_id = 3;
}

message SubscribeRunEventsRequest {
  string user_id = 1;
  string conversation_id = 2;
  string run_id = 3;
  google.protobuf.Int64Value after_sequence = 4;
}

message RunView {
  string conversation_id = 1;
  string run_id = 2;
  string status = 3;
  int64 latest_sequence = 4;
  string reply = 5;
  string result_json = 6;
}

message RunEvent {
  int64 sequence = 1;
  string event_name = 2;
  string data_json = 3;
}

message ListConversationsRequest {
  string user_id = 1;
  int32 limit = 2;
}

message ConversationView {
  string conversation_id = 1;
  string title = 2;
  string last_message_preview = 3;
  int32 message_count = 4;
  string last_message_at = 5;
}

message ListConversationsResponse {
  repeated ConversationView items = 1;
}

message ListMessagesRequest {
  string user_id = 1;
  string conversation_id = 2;
  int32 limit = 3;
  google.protobuf.Int64Value before_id = 4;
}

message ChatMessageView {
  int64 id = 1;
  string conversation_id = 2;
  string run_id = 3;
  string role = 4;
  string content_json = 5;
  string status = 6;
  string source = 7;
  string meta_json = 8;
  string created_at = 9;
}

message ListMessagesResponse {
  string conversation_id = 1;
  repeated ChatMessageView items = 2;
  google.protobuf.Int64Value next_before_id = 3;
}

message DeleteConversationRequest {
  string user_id = 1;
  string conversation_id = 2;
}

message DeleteConversationResponse {
  string conversation_id = 1;
  bool deleted = 2;
}

message GetSourceLimitsRequest {}

message SourceLimitsView {
  int32 arxiv = 1;
  int32 dblp = 2;
  int32 google_scholar = 3;
  int32 arxiv_page_size = 4;
  int32 dblp_page_size = 5;
  int32 google_scholar_page_size = 6;
  int32 arxiv_maximum = 7;
  int32 dblp_maximum = 8;
  int32 google_scholar_maximum = 9;
}

message UpdateSourceLimitsRequest {
  int32 arxiv = 1;
  int32 dblp = 2;
  int32 google_scholar = 3;
}

message ListLlmProfilesRequest {}

message LlmProfileView {
  int64 id = 1;
  string name = 2;
  string provider = 3;
  string base_url = 4;
  string model = 5;
  bool key_set = 6;
  string key_last4 = 7;
  bool enabled = 8;
  bool is_default = 9;
  bool is_small_model = 10;
  int32 version = 11;
  string created_at = 12;
  string updated_at = 13;
}

message ListLlmProfilesResponse {
  repeated LlmProfileView items = 1;
}

message CreateLlmProfileRequest {
  string name = 1;
  string provider = 2;
  string base_url = 3;
  string model = 4;
  string api_key = 5;
  google.protobuf.BoolValue enabled = 6;
  google.protobuf.BoolValue is_default = 7;
  google.protobuf.BoolValue is_small_model = 8;
}

message UpdateLlmProfileRequest {
  int64 profile_id = 1;
  google.protobuf.StringValue name = 2;
  google.protobuf.StringValue provider = 3;
  google.protobuf.StringValue base_url = 4;
  google.protobuf.StringValue model = 5;
  google.protobuf.StringValue api_key = 6;
  google.protobuf.BoolValue enabled = 7;
  google.protobuf.BoolValue is_default = 8;
  google.protobuf.BoolValue is_small_model = 9;
}

message SetDefaultLlmProfileRequest { int64 profile_id = 1; }
message DeleteLlmProfileRequest { int64 profile_id = 1; }
message TestLlmProfileRequest { int64 profile_id = 1; }
message DeleteLlmProfileResponse { int64 id = 1; bool deleted = 2; }
message TestLlmProfileResponse { bool ok = 1; google.protobuf.Int32Value model_count = 2; string message = 3; }
