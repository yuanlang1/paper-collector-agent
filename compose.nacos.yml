services:
  nacos:
    image: nacos/nacos-server:v3.2.0
    container_name: paper-collector-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      # Nacos 3.x requires these values at startup even when auth is disabled.
      # Replace all three values before enabling authentication.
      NACOS_AUTH_TOKEN: VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
      NACOS_AUTH_IDENTITY_KEY: paper-collector-nacos
      NACOS_AUTH_IDENTITY_VALUE: paper-collector-agent
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: Asia/Shanghai
    ports:
      - "8080:8080" # Nacos console
      - "8848:8848" # HTTP API
      - "9848:9848" # gRPC SDK
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs

volumes:
  nacos-data:
  nacos-logs:
